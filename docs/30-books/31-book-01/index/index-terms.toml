# Book 1 index term list
#
# This file decides what goes in the back-of-book index. The chapters themselves
# carry no index markup; scripts/build_book_index.py finds these phrases when
# the book is built. See README.md in this folder for how to maintain it.
#
# Each [[entry]] can use:
#   term      the heading a reader looks up (required)
#   sub       a subentry under that heading
#   match     phrases to find; case-insensitive, whole words. A trailing * on a
#             word matches any ending ("hallucinat*"); a space also matches a
#             hyphen ("decision support" finds "decision-support")
#   case      true to match capitalisation exactly (names, acronyms)
#   chapters  limit to these chapters, e.g. [3, 4, "epilogue"]
#   scope     "paragraph" (default: one entry per paragraph, list or table) or
#             "chapter" (first mention in each chapter only, for broad terms)
#   see       a pure cross-reference ("LLM" -> see "Language models")
#   see_also  related headings
#   sort      override the sort key (defaults to the lower-cased term)
#
# The same term may appear in several [[entry]] tables (for example with
# different chapter limits); they are merged.

